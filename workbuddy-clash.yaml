proxy-groups:
  - name: WorkBuddy
    type: select
    proxies:
      - 🚀 节点选择        # ← 改成你自己的代理组名
      - DIRECT

rules:
  # ---------------------------------------------------------------------------
  # 1. 国际版核心：API / 聊天 / 控制台 / Agent WebSocket
  # ---------------------------------------------------------------------------
  - DOMAIN-SUFFIX,workbuddy.ai,WorkBuddy
  - DOMAIN-SUFFIX,codebuddy.ai,WorkBuddy

  # ---------------------------------------------------------------------------
  # 2. 云端沙箱 / 编辑器预览
  # ---------------------------------------------------------------------------
  - DOMAIN-SUFFIX,workbuddy.agentos-worker.net,WorkBuddy
  - DOMAIN-SUFFIX,staging.agentos-worker.net,WorkBuddy
  - DOMAIN-SUFFIX,workbuddy-sandbox.com,WorkBuddy

  # ---------------------------------------------------------------------------
  # 3. 知识库分享校验（新加坡）
  # ---------------------------------------------------------------------------
  - DOMAIN-SUFFIX,tencentsmh.com,WorkBuddy

  # ---------------------------------------------------------------------------
  # 4. 国际版遥测（HK/SG）
  # ---------------------------------------------------------------------------
  - DOMAIN-SUFFIX,tgalileo.com,WorkBuddy

  # ---------------------------------------------------------------------------
  # 5. 出口 IP 探测（已取消注释并改为直连）
  # ---------------------------------------------------------------------------
  - DOMAIN-SUFFIX,ipify.org,DIRECT

  # ---------------------------------------------------------------------------
  # 7. 登录页（已取消注释并改为直连）
  # ---------------------------------------------------------------------------
  - DOMAIN-SUFFIX,tencent.sso.codebuddy.cn,DIRECT

  # ---------------------------------------------------------------------------
  # 补充：原注释说明中提及的国内/按需域名（已全部整理为标准直连规则）
  # ---------------------------------------------------------------------------
  - DOMAIN-SUFFIX,workbuddy.link,DIRECT
  - DOMAIN-SUFFIX,static.workbuddy.cn,DIRECT
  - DOMAIN-SUFFIX,download.codebuddy.cn,DIRECT
  - DOMAIN-WILDCARD,workbuddy-extensions-*.myqcloud.com,DIRECT
  - DOMAIN-WILDCARD,codebuddy-platform-*.myqcloud.com,DIRECT
  - DOMAIN-SUFFIX,docs.qq.com,DIRECT
  - DOMAIN-SUFFIX,work.weixin.qq.com,DIRECT
  - DOMAIN-SUFFIX,map.qq.com,DIRECT
  - DOMAIN-SUFFIX,galileotelemetry.tencent.com,DIRECT
